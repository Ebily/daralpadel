<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>دار البادل | هل أنت جاهز للعب؟</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="intro-page">
  <div class="intro-noise"></div>
  <div class="intro-glow intro-glow-a"></div>
  <div class="intro-glow intro-glow-b"></div>
  <main class="intro-scene" aria-label="مقدمة دار البادل">
    <div class="intro-court-shell">
      <div class="intro-court">
        <span class="intro-line intro-line-mid"></span>
        <span class="intro-line intro-line-left"></span>
        <span class="intro-line intro-line-right"></span>
        <span class="intro-net"></span>
      </div>
      <div class="intro-racket intro-racket-left"></div>
      <div class="intro-racket intro-racket-right"></div>
      <div class="intro-ball"></div>
    </div>

    <section class="intro-content">
      <img class="intro-logo" src="logo.png" alt="دار البادل">
      <p class="intro-kicker">اللعبة لها دار</p>
      <h1>هل أنت جاهز<br><span>لدخول الملعب؟</span></h1>
      <p class="intro-copy">ادخل إلى عالم دار البادل؛ اختر شريكك، واقرأ الملعب، وسيطر على الشبكة، واجعل النقطة القادمة لك.</p>
      <a class="intro-enter" href="home.html">
        <span>ابدأ التجربة</span>
        <i aria-hidden="true">↗</i>
      </a>
      <button class="intro-lang" type="button" aria-label="Switch language">EN</button>
    </section>
    <div class="intro-hint">حرّك المؤشر، ثم ادخل الملعب</div>
  </main>
<script src="script.js"></script>
</body>
</html>
